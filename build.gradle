plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

tasks.register('copyDevJar', Copy) {
    doFirst {
        delete fileTree(layout.projectDirectory.dir('dev-builds')) {
            include '*.jar'
        }
    }
    from tasks.named('jar')
    into layout.projectDirectory.dir('dev-builds')
}

def instanceDirs = [
    file('C:/Users/Nick/.minecraftx/instances/26.3-fabric0.19.5/mods'),
    file('C:/Users/Nick/Downloads/f0dc6a2a-6766-4b2b-98c3-6fad9397c828/minecraft/mods')
]

tasks.register('copyInstanceJar') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        instanceDirs.each { instanceModsDir ->
            if (instanceModsDir.exists() && instanceModsDir.isDirectory()) {
                def targetFile = new File(instanceModsDir, jarFile.name)
                boolean blocked = false
                instanceModsDir.listFiles()?.findAll { it.name.startsWith('libri-') && it.name.endsWith('.jar') && it.name != jarFile.name }?.each { oldJar ->
                    oldJar.setWritable(true)
                    if (!oldJar.delete()) {
                        logger.warn("[Libri] Cannot remove locked mod jar (is Minecraft running?): {}", oldJar.absolutePath)
                        blocked = true
                    }
                }
                if (blocked) {
                    logger.warn("[Libri] Skipped copying {} to instance mods to avoid duplicate Libri jars while old jar is locked.", jarFile.name)
                    return
                }
                try {
                    java.nio.file.Files.copy(jarFile.toPath(), targetFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                    logger.lifecycle("[Libri] Updated instance mod jar: {}", targetFile.absolutePath)
                } catch (IOException e) {
                    logger.warn("[Libri] Could not overwrite instance mod jar (close Minecraft first): {} ({})", targetFile.absolutePath, e.message)
                }
            }
        }
    }
}

tasks.named('build') {
    finalizedBy 'copyDevJar', 'copyInstanceJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}
